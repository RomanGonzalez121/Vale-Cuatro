name: Integración continua

on:
  push:
  pull_request:

jobs:
  pruebas:
    name: Tests y estilo de código
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependencias de PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Dependencias y compilación del frontend
        run: |
          npm ci
          npm run build

      - name: Entorno de pruebas
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Estilo de código (Pint)
        run: vendor/bin/pint --test

      - name: Tests (PHPUnit)
        run: |
          set -o pipefail
          php artisan test 2>&1 | tee storage/logs/tests.txt

      # Lo que falló, dicho como avisos de la corrida: se lee sin tener que entrar al registro.
      - name: Qué falló
        if: failure()
        run: |
          grep -E "FAILED|Failed asserting|Exception|tests/.*\.php:[0-9]+" storage/logs/tests.txt | sed 's/\x1b\[[0-9;]*m//g' | head -10 | while IFS= read -r linea; do echo "::error title=Test::$linea"; done || true
          # Cada test que falló, con las líneas que siguen (el mensaje y dónde pasó), en un solo aviso.
          sed 's/\x1b\[[0-9;]*m//g' storage/logs/tests.txt | awk '/FAILED/{n=14; t=""} n>0{gsub(/^ +| +$/, ""); if ($0 != "") t=t " | " $0; n--; if (n==0) print t}' | head -6 | cut -c 1-1500 | while IFS= read -r linea; do echo "::error title=Error del test::$linea"; done || true

  # Un Chrome de verdad usa el sitio como una persona: entra sin cuenta, se registra, ingresa y juega
  # una mano entera contra el bot. Lo que los otros tests no ven es la pantalla, y esto la prueba.
  navegador:
    name: Pruebas en un navegador real
    runs-on: ubuntu-latest

    # El sitio de prueba y las pruebas comparten estas variables. La base es un archivo SQLite vacío,
    # y la cola corre en el momento: el bot juega apenas le toca, sin un proceso aparte.
    env:
      APP_ENV: testing
      APP_DEBUG: "true"
      APP_URL: http://127.0.0.1:8010
      DB_CONNECTION: sqlite
      DB_DATABASE: ${{ github.workspace }}/database/dusk.sqlite
      QUEUE_CONNECTION: sync
      BROADCAST_CONNECTION: log
      SESSION_DRIVER: file
      CACHE_STORE: file
      DUSK_URL: http://127.0.0.1:8010

    steps:
      - uses: actions/checkout@v4

      - name: PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependencias de PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Dependencias y compilación del frontend
        run: |
          npm ci
          npm run build

      - name: Entorno y base de prueba
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/dusk.sqlite
          php artisan migrate --force

      - name: Controlador de Chrome, para la versión instalada
        run: php artisan dusk:chrome-driver --detect

      - name: Sitio de prueba
        run: |
          # Cuatro pedidos a la vez: con uno solo, una jugada lenta de la máquina traba la página siguiente.
          PHP_CLI_SERVER_WORKERS=4 php artisan serve --host=127.0.0.1 --port=8010 > storage/logs/servidor.log 2>&1 &
          for intento in $(seq 1 30); do
            curl --silent --fail http://127.0.0.1:8010/up > /dev/null && exit 0
            sleep 1
          done
          echo "El sitio de prueba no respondió." && cat storage/logs/servidor.log && exit 1

      - name: Pruebas de navegador (Dusk)
        run: |
          set -o pipefail
          php artisan dusk 2>&1 | tee storage/logs/dusk.txt

      # Lo que falló, dicho como avisos de la corrida: se lee sin tener que entrar al registro.
      - name: Qué falló
        if: failure()
        run: |
          grep -E "FAILED|Failed asserting|Exception|Waited|tests/Browser/.*\.php:[0-9]+" storage/logs/dusk.txt | sed 's/\x1b\[[0-9;]*m//g' | head -10 | while IFS= read -r linea; do echo "::error title=Prueba de navegador::$linea"; done || true
          # Cada prueba que falló, con las líneas que siguen (ahí está el mensaje del error), en un solo aviso.
          sed 's/\x1b\[[0-9;]*m//g' storage/logs/dusk.txt | awk '/FAILED/{n=8; t=""} n>0{gsub(/^ +| +$/, ""); if ($0 != "") t=t " | " $0; n--; if (n==0) print t}' | head -6 | while IFS= read -r linea; do echo "::error title=Error de la prueba::$linea"; done || true
          # Y lo que el navegador anotó en su consola (los errores de JavaScript de la página).
          cat tests/Browser/console/*.log 2>/dev/null | head -c 3000 | tr '\n' ' ' | while IFS= read -r linea; do echo "::error title=Consola del navegador::$linea"; done || true
          # Y los errores que anotó el sitio de prueba (una página que falla en el servidor no deja nada en la consola).
          grep -h -E "local\.ERROR|testing\.ERROR" storage/logs/laravel*.log 2>/dev/null | cut -c 1-600 | head -4 | while IFS= read -r linea; do echo "::error title=Error del sitio::$linea"; done || true
          tail -n 15 storage/logs/servidor.log 2>/dev/null | cut -c 1-300 | tr '\n' ' ' | while IFS= read -r linea; do echo "::error title=Servidor de prueba::$linea"; done || true

      # Si algo falla, queda lo que el navegador tenía en pantalla y lo que escribió el sitio.
      - name: Capturas y registros, si falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: navegador
          path: |
            tests/Browser/screenshots
            tests/Browser/console
            storage/logs
