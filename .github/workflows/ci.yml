name: Integración continua

on:
  push:
  pull_request:

jobs:
  pruebas:
    name: Tests y estilo de código
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependencias de PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Dependencias y compilación del frontend
        run: |
          npm ci
          npm run build

      - name: Entorno de pruebas
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Estilo de código (Pint)
        run: vendor/bin/pint --test

      - name: Tests (PHPUnit)
        run: php artisan test
