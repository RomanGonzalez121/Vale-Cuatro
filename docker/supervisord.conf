; Los procesos del contenedor. Supervisor arranca cada uno, y si alguno se cae lo vuelve a levantar.
; Todo lo que escriben sale por el registro del contenedor, que es el que muestra Render.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; Las páginas: PHP las arma y nginx las entrega.
[program:php]
command=php-fpm --nodaemonize
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Los procesos de fondo esperan unos segundos antes de arrancar, de a uno. Con una décima de procesador,
; si arrancan todos juntos se lo reparten y la web tarda minutos en atender su primer pedido.

; El tiempo real: avisa en vivo a quien juega con otra persona. Escucha solo adentro del contenedor;
; nginx le pasa los navegadores.
[program:tiempo-real]
command=sh -c "sleep 25 && exec php artisan reverb:start --host=127.0.0.1 --port=8080"
directory=/var/www/html
user=www-data
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; La cola: de acá salen el turno del bot y los plazos de las partidas entre personas.
; Se reinicia sola cada hora para devolver la memoria que haya ido juntando.
[program:cola]
command=sh -c "sleep 10 && exec php artisan queue:work --sleep=0.5 --tries=1 --max-time=3600 --memory=100"
directory=/var/www/html
user=www-data
priority=30
autorestart=true
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Las tareas programadas: la limpieza de invitados y de salas.
[program:tareas]
command=docker/tareas.sh
directory=/var/www/html
user=www-data
priority=40
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Los jugadores de ejemplo del ranking. Corre una vez por arranque, de fondo y al final, para que el
; sitio no espere: la primera vez juega sus partidas (son varios minutos en un procesador chico) y las
; demás veces ve que ya están y termina enseguida.
[program:siembra]
command=sh -c "sleep 60 && exec php artisan ranking:ejemplo"
directory=/var/www/html
user=www-data
priority=50
autorestart=false
startsecs=0
exitcodes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
