; Ajustes de PHP para el sitio publicado. Se suman al php.ini de producción que trae la imagen.

; El contenedor gratis tiene 512 MB para todo: cada proceso de PHP tiene su tope.
memory_limit = 128M

; No decirle al mundo qué versión de PHP corre.
expose_php = Off

; El código no cambia mientras el contenedor vive: se compila una vez y no se vuelve a mirar el disco.
opcache.enable = 1
opcache.memory_consumption = 64
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0

; Lo compilado también se guarda en disco, y vale para la consola. Cada comando de artisan (la cola, el
; tiempo real, las tareas de cada rato) arranca de cero: sin esto vuelve a leer y compilar todo Laravel,
; y con una décima de procesador eso son varios segundos cada vez. La carpeta ya viene llena en la imagen.
opcache.enable_cli = 1
opcache.file_cache = /var/cache/opcache

; Los errores van al registro de Render, no a la pantalla.
log_errors = On
error_log = /dev/stderr
