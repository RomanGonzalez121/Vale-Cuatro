; Los procesos de PHP que atienden las páginas. Se suma a la configuración que trae la imagen.
[www]

; Solo nginx, que está en el mismo contenedor, les habla.
listen = 127.0.0.1:9000

; Arrancan cuando llega un pedido y se van si quedan sin trabajo: con 512 MB para todo, un proceso
; de PHP esperando sin hacer nada es memoria que le falta a otro. Tres a la vez como mucho.
pm = ondemand
pm.max_children = 3
pm.process_idle_timeout = 30s
pm.max_requests = 500

; Lo que el sitio escribe en su registro sale por el registro del contenedor.
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
