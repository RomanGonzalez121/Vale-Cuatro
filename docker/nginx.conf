# El servidor web del contenedor. Recibe todo lo que llega al puerto público y lo reparte:
# los archivos los entrega él, las páginas se las pasa a PHP y el tiempo real se lo pasa a Reverb.
# __PUERTO__ lo completa docker/arranque.sh con el puerto que pida Render.

worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # El registro de pedidos ya lo lleva Render delante del contenedor.
    access_log off;

    sendfile on;
    server_tokens off;
    client_max_body_size 1m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Un WebSocket empieza como un pedido común que pide "pasar a otra cosa": hay que reenviar ese pedido tal cual.
    map $http_upgrade $conexion {
        default upgrade;
        '' close;
    }

    server {
        listen __PUERTO__ default_server;
        server_name _;
        root /var/www/html/public;
        index index.php;
        charset utf-8;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # Lo compilado por Vite lleva una huella en el nombre: si cambia el contenido, cambia el nombre.
        # Por eso el navegador lo puede guardar un año sin volver a preguntar.
        location /build/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options nosniff always;
            try_files $uri =404;
        }

        # El tiempo real. Reverb escucha solo adentro del contenedor; de afuera se llega nada más que a
        # esta puerta, la de los navegadores. La otra (por donde el sitio le avisa qué pasó) no se publica.
        location /app/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $conexion;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 120s;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # El único archivo de PHP que se ejecuta es la entrada de Laravel.
        location = /index.php {
            fastcgi_pass 127.0.0.1:9000;
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            fastcgi_hide_header X-Powered-By;
        }

        location ~ \.php$ {
            return 404;
        }

        # Nada que empiece con punto (salvo lo que piden los certificados).
        location ~ /\.(?!well-known) {
            deny all;
        }
    }
}
